site_name: ML Production Stack
site_description: Documentation portal for the Machine-Learning production system
site_url: https://unesprodrigofct.github.io/machine-learning
repo_url: https://github.com/unesprodrigofct/machine-learning
repo_name: unesprodrigofct/machine-learning
nav:
  - Home: README.md
  - Architecture: docs/architecture/README.md
  - API: docs/api/openapi.yaml
  - Roadmap: docs/roadmap.md
  - Templates: docs/templates/README_template.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append("src")
extra_css:
  - css/extra.css
