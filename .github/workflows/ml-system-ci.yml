name: ml-system-ci

on:
  pull_request:
    paths:
      - "Machine-Learning/**"
  push:
    branches:
      - main
      - master
      - production

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      poetry-cache-hit: ${{ steps.cache-poetry.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: false
      - name: Ensure Poetry on PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache Poetry virtualenvs
        id: cache-poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('Machine-Learning/poetry.lock') }}
      - name: Install dependencies
        working-directory: Machine-Learning
        run: poetry install --with dev

  lint-and-type:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: false
      - name: Ensure Poetry on PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('Machine-Learning/poetry.lock') }}
      - name: Install dependencies
        working-directory: Machine-Learning
        run: poetry install --with dev
      - name: Run linters
        working-directory: Machine-Learning
        run: |
          poetry run black --check src tests
          poetry run isort --check-only src tests
          poetry run ruff check src tests
      - name: Type checking
        working-directory: Machine-Learning
        run: poetry run mypy --strict src
      - name: Security scanning
        working-directory: Machine-Learning
        run: |
          poetry run bandit -r src -c pyproject.toml
          poetry run safety check --full-report

  tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: false
      - name: Ensure Poetry on PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('Machine-Learning/poetry.lock') }}
      - name: Install dependencies
        working-directory: Machine-Learning
        run: poetry install --with dev
      - name: Run pytest
        working-directory: Machine-Learning
        run: poetry run pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: Machine-Learning/coverage.xml

  build-image:
    runs-on: ubuntu-latest
    needs: [lint-and-type, tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        working-directory: Machine-Learning
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}/ml-api:${{ github.sha }} \
            --file tools/docker/Dockerfile \
            --push .

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
      - name: Helm upgrade
        env:
          KUBECONFIG: ./kubeconfig
        run: |
          helm upgrade --install ml-api tools/helm/ml-api \
            --set image.repository=ghcr.io/${{ github.repository }}/ml-api \
            --set image.tag=${{ github.sha }}
