[tool.poetry]
name = "machine-learning"
version = "0.1.0"
description = "Professional ML portfolio with training scripts, API, and pipeline utilities."
authors = ["Rodrigo Silva <contact@domain.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = ">=2.0"
numpy = ">=1.24"
scikit-learn = ">=1.3"
xgboost = ">=1.7"
joblib = ">=1.2"
fastapi = ">=0.115"
uvicorn = { version = ">=0.29", extras = ["standard"] }
sqlalchemy = ">=2.0"
pydantic-settings = ">=2.4"
mlflow = ">=2.12"
structlog = ">=24.1"
prometheus-client = ">=0.20"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
black = ">=23.7"
mypy = ">=1.5"
isort = ">=5.12"
ruff = ">=0.5"
bandit = ">=1.7"
safety = ">=3.0"
pre-commit = ">=3.6"
pytest-mock = ">=3.12"
pytest-benchmark = ">=4.0"
nbstripout = ">=0.7"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(\.git|\.venv|venv|docs|build)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
exclude = ["docs", "build", "dist", "artifacts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
  "UP",
  "N",
  "ANN",
  "S",
  "ASYNC"
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
