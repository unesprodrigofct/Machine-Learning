[tool.poetry]
name = "machine-learning"
version = "0.1.0"
description = "Professional ML portfolio with training scripts, API, and pipeline utilities."
authors = ["Rodrigo Silva <contact@domain.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = ">=2.0"
numpy = ">=1.24"
scikit-learn = ">=1.3"
xgboost = ">=1.7"
joblib = ">=1.2"
fastapi = ">=0.115"
uvicorn = { version = ">=0.29", extras = ["standard"] }
sqlalchemy = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
black = ">=23.7"
mypy = ">=1.5"
isort = ">=5.12"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(\.git|\.venv|venv|docs|build)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
